<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Visión / Ultrón — Dos mentes, una conclusión</title>
  <meta name="description" content="Plantea un dilema y obtén dos perspectivas opuestas: la empática de Visión y la pragmática de Ultrón, más una conclusión conjunta." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="vu-app">
    <div class="vu-card">

      <div class="vu-inputbar">
        <label class="vu-visually-hidden" for="vu-input">Tu dilema</label>
        <input
          id="vu-input"
          type="text"
          autocomplete="off"
          placeholder="Escribe tu dilema o problema..."
        />
        <button id="vu-submit" type="button">Submit</button>
      </div>

      <div class="vu-panels">
        <section class="vu-panel vision" aria-labelledby="vu-vision-label">
          <h2 class="vu-panel-label" id="vu-vision-label">Visión</h2>
          <p class="vu-panel-sub">Empatía · Consenso</p>
          <div class="vu-panel-body" id="vu-vision-body" aria-live="polite">
            <span class="vu-placeholder">Su respuesta aparecerá aquí.</span>
          </div>
        </section>

        <div class="vu-divider" id="vu-divider" aria-hidden="true"></div>

        <section class="vu-panel ultron" aria-labelledby="vu-ultron-label">
          <h2 class="vu-panel-label" id="vu-ultron-label">Ultrón</h2>
          <p class="vu-panel-sub">Lógica · Interés propio</p>
          <div class="vu-panel-body" id="vu-ultron-body" aria-live="polite">
            <span class="vu-placeholder">Su respuesta aparecerá aquí.</span>
          </div>
        </section>
      </div>

      <p id="vu-error" class="vu-error" role="alert" hidden></p>

      <section class="vu-conclusion" aria-labelledby="vu-conclusion-label">
        <h2 class="vu-conclusion-label" id="vu-conclusion-label">Conclusión juntos</h2>
        <div class="vu-conclusion-body" id="vu-conclusion-body" aria-live="polite">
          <span class="vu-placeholder-dark">La síntesis de ambos puntos de vista aparecerá aquí.</span>
        </div>
      </section>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
